name: nightly

# Against a real chain: index a testnet range end to end and check it against the node, prove
# receipts against headers, and run the benchmarks. Needs the TESTNET_RPC_URL secret.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testnet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tidemark
          POSTGRES_PASSWORD: tidemark
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidemark"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TIDEMARK_TEST_DATABASE_URL: postgres://tidemark:tidemark@127.0.0.1:5432/postgres
      TESTNET_RPC_URL: ${{ secrets.TESTNET_RPC_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.7.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Testnet end to end
        if: env.TESTNET_RPC_URL != ''
        run: pnpm --filter @tidemark/bench run testnet
      - name: Receipts roots of 2,000 recent testnet blocks
        if: env.TESTNET_RPC_URL != ''
        run: RPC_URL="$TESTNET_RPC_URL" CHAIN_ID=84532 COUNT=2000 pnpm --filter @tidemark/rpc run verify-receipts
      - name: Benchmarks
        run: |
          pnpm --filter @tidemark/bench run erc20 | tee -a bench.jsonl
          pnpm --filter @tidemark/bench run api | tee -a bench.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: bench.jsonl
