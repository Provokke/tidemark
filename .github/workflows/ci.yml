name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.7.1
  TERRAFORM_VERSION: 1.16.7
  HELM_VERSION: v3.19.0

jobs:
  checks:
    name: format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Lint is type-aware: workspace packages resolve to their built types.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - working-directory: contracts
        run: forge fmt --check
      - working-directory: contracts
        run: forge build --sizes
      - working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test
      - name: generated artefacts are up to date
        working-directory: contracts
        run: |
          node scripts/generate-artifacts.mjs
          git diff --exit-code -- ts/artifacts.generated.ts

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tidemark
          POSTGRES_PASSWORD: tidemark
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidemark"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TIDEMARK_TEST_DATABASE_URL: postgres://tidemark:tidemark@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start NATS (JetStream) and Redpanda (Kafka) for the broker tests
        run: |
          docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 \
            --kafka-addr 0.0.0.0:9092 --advertise-kafka-addr 127.0.0.1:9092
          for i in $(seq 1 60); do
            docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true' && break
            sleep 2
          done
      - run: pnpm run test:integration
        env:
          TIDEMARK_TEST_NATS_URL: nats://127.0.0.1:4222
          TIDEMARK_TEST_KAFKA_BROKERS: 127.0.0.1:9092

  terraform:
    name: terraform fmt, validate, tflint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/examples/minimal init -backend=false -input=false
      - run: terraform -chdir=infra/terraform/examples/minimal validate
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --chdir=infra/terraform/modules/tidemark --recursive

  helm:
    name: helm lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: helm lint --strict infra/helm/tidemark
      - run: helm template t infra/helm/tidemark --set ingress.enabled=true --set serviceMonitor.enabled=true > /dev/null

  image:
    name: image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: tidemark:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The CLI runs, and builds the example project in the image layout
        run: |
          docker run --rm tidemark:ci --help
          docker run --rm -v "$PWD/examples/erc20:/opt/tidemark/project" --user root tidemark:ci build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
