# Extends gitleaks' default rules. Test fixtures, compiled contract bytecode and the example
# environment file hold made-up values that look like keys.
[extend]
useDefault = true

[[allowlists]]
description = "Test fixtures, generated bytecode and example config"
paths = [
  '''(^|/)test/''',
  '''\.test\.tsx?$''',
  '''^contracts/ts/artifacts\.generated\.ts$''',
  '''\.env\.example$''',
]
