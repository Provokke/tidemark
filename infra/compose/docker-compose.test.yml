# Services for Tidemark's integration tests on a developer machine. CI uses the same images as
# GitHub Actions service containers.
#
#   docker compose -f infra/compose/docker-compose.test.yml up -d
#   export TIDEMARK_TEST_DATABASE_URL=postgres://tidemark:tidemark@127.0.0.1:55432/postgres
#
# Anvil is not here: the harness starts its own Anvil per test file from the Foundry binary,
# so tests can run in parallel on separate chains.
name: tidemark-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tidemark
      POSTGRES_PASSWORD: tidemark
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    # Test data is disposable: trade durability for speed.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tidemark"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Fault injection between the indexer and Anvil (latency, resets, truncated bodies). Used from
  # the RPC layer's tests.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    network_mode: host
