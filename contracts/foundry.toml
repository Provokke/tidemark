[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
# Pinned: the compiler and EVM version are part of every deployed address and of the
# bytecode the decoding golden tests run against.
solc_version = "0.8.38"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = ["forge-std/=lib/forge-std/src/"]

[profile.default.fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 256

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
